# Azure OpenAI: copy this template to secrets.yaml and fill in your resource keys.
# Direct OpenAI: use the secrets.yaml supplied through Brightspace.
apiVersion: v1
kind: Secret
metadata:
  name: openai-gpt-api-secret
type: Opaque
stringData:
  OPENAI_GPT_API_KEY: "<text-resource-key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-dalle-api-secret
type: Opaque
stringData:
  OPENAI_DALLE_API_KEY: "<image-resource-key>"
